<!DOCTYPE html>
<html>
<head>
    <title>Computer Applications Quiz</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        let timeLeft = 60;
        function updateTimer() {
            const timerDisplay = document.getElementById("timer");
            timerDisplay.innerText = `Time Left: ${timeLeft}s`;
            if (timeLeft <= 0) {
                document.getElementById("quiz-form").submit();
            }
            timeLeft--;
        }
        setInterval(updateTimer, 1000);
    </script>
</head>
<body>
    <div class="container">
        <h1>Computer Applications Quiz</h1>
        <div id="timer">Time Left: 60s</div>
        <form action="/submit" method="POST" id="quiz-form">
            {% for i in range(questions|length) %}
                <div class="question-block">
                    <h3>{{ i + 1 }}. {{ questions[i].question }}</h3>
                    {% for option in questions[i].options %}
                        <label>
                            <input type="radio" name="q{{ i }}" value="{{ option }}" required>
                            {{ option }}
                        </label><br>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
